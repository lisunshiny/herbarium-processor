# .pre-commit-config.yaml
repos:
  # Strip outputs from Jupyter notebooks
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        # ensure we only target notebooks (default is fine too)
        files: \.ipynb$
  # Lint Python with Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  # Vue linting (npm plugin)
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.37.0
    hooks:
      - id: eslint
        name: ESLint (frontend)
        entry: eslint --config src/herbarium_processor/web/frontend/eslint.config.js --ext .js,.vue,.json src/herbarium_processor/web/frontend
        language: node
        pass_filenames: false
        additional_dependencies:
          - eslint@9.37.0
          - "@eslint/js"
          - eslint-plugin-vue
          - vue-eslint-parser
          - eslint-plugin-jsonc
          - jsonc-eslint-parser
          - globals