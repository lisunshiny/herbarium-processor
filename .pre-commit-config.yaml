# .pre-commit-config.yaml
repos:
  # Format Python & notebooks
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.1.0
    hooks:
      - id: black-jupyter
        # optional, match your project’s Python
        # language_version: python3.11

  # Strip outputs from Jupyter notebooks
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        # ensure we only target notebooks (default is fine too)
        files: \.ipynb$
