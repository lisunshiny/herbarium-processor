name: pre-commit

on: [pull_request, push]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1️⃣ Set up Python (for Ruff, nbstripout, etc.)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 2️⃣ Set up Node (for ESLint, Vue linting)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3️⃣ Install Poetry + project deps
      - run: pip install poetry
      - run: poetry install

      # 4️⃣ Install frontend Node deps so ESLint can resolve @eslint/js etc.
      - run: npm ci --prefix src/herbarium_processor/web/frontend

      # 5️⃣ Run pre-commit hooks (this will call ESLint via mirrors-eslint)
      - run: poetry run pre-commit run --all-files
