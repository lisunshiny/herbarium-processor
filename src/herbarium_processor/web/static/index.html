<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Herbarium Processor</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/cropperjs@1.5.13/dist/cropper.min.css">
    <script src="https://unpkg.com/cropperjs@1.5.13/dist/cropper.min.js"></script>
    <style>
        img { max-width: 300px; display: block; margin-bottom: 8px; }
        .record { border: 1px solid #ccc; padding: 10px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 4px; }
    </style>
</head>
<body>
<div id="app">
    <h1>Herbarium Processor</h1>

    <div v-if="stage === 'upload'">
        <form @submit.prevent="upload">
            <input type="file" ref="files" multiple accept="image/*">
            <button type="submit">Upload</button>
        </form>
    </div>

    <div v-if="stage === 'sanitize'">
        <h3>Adjust Image {{ cropIndex + 1 }} / {{ images.length }}</h3>
        <img :src="images[cropIndex]" ref="cropImg">
        <button @click="rotateLeft">Rotate Left</button>
        <button @click="rotateRight">Rotate Right</button>
        <button @click="nextCrop">{{ cropIndex === images.length - 1 ? 'Finish' : 'Next' }}</button>
    </div>

    <div v-if="stage === 'edit'">
        <div v-for="(row, idx) in rows" :key="idx" class="record">
            <img :src="row.ocr_image" alt="Annotated image">
            <div><strong>ID: {{ row.id }}</strong></div>
            <div v-for="field in fieldnames">
                <label>{{ field }}
                    <input v-model="row[field]" />
                </label>
            </div>
        </div>
        <button @click="finalize">Finalize CSV</button>
    </div>

    <div v-if="stage === 'done'">
        <a :href="`/download/${jobId}`" download>Download CSV</a>
    </div>

    <div>{{ status }}</div>
</div>

<script>
const { createApp } = Vue;
createApp({
    data() {
        return {
            stage: 'upload',
            jobId: '',
            rows: [],
            fieldnames: [],
            status: '',
            images: [],
            cropIndex: 0,
            cropData: [],
            cropper: null
        };
    },
    methods: {
        async upload() {
            const files = this.$refs.files.files;
            if (!files.length) {
                alert('Please select at least one image.');
                return;
            }
            this.status = 'Processing...';
            const formData = new FormData();
            for (const f of files) {
                formData.append('files', f);
            }
            const resp = await fetch('/upload', { method: 'POST', body: formData });
            if (!resp.ok) {
                this.status = 'Upload failed';
                return;
            }
            const data = await resp.json();
            this.jobId = data.job_id;
            this.images = data.images;
            this.cropIndex = 0;
            this.cropData = [];
            this.stage = 'sanitize';
            this.$nextTick(this.initCropper);
        },
        async fetchResults() {
            const resp = await fetch(`/results/${this.jobId}`);
            if (!resp.ok) {
                this.status = 'Failed to fetch results';
                return;
            }
            const data = await resp.json();
            this.fieldnames = data.fieldnames.filter(f => f !== 'id');
            this.rows = data.rows;
            this.stage = 'edit';
            this.status = '';
        },
        initCropper() {
            if (this.cropper) this.cropper.destroy();
            const img = this.$refs.cropImg;
            this.cropper = new Cropper(img, { viewMode: 1 });
        },
        rotateLeft() {
            if (this.cropper) this.cropper.rotate(-90);
        },
        rotateRight() {
            if (this.cropper) this.cropper.rotate(90);
        },
        async nextCrop() {
            const data = this.cropper.getData(true);
            this.cropData.push({
                filename: this.images[this.cropIndex].split('/').pop(),
                x: data.x,
                y: data.y,
                width: data.width,
                height: data.height,
                rotate: data.rotate
            });
            if (this.cropIndex < this.images.length - 1) {
                this.cropIndex++;
                this.$nextTick(this.initCropper);
            } else {
                await this.submitCrops();
            }
        },
        async submitCrops() {
            this.status = 'Processing...';
            const resp = await fetch(`/sanitize/${this.jobId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(this.cropData)
            });
            if (!resp.ok) {
                this.status = 'Image processing failed';
                return;
            }
            await this.fetchResults();
        },
        async finalize() {
            const resp = await fetch(`/finalize/${this.jobId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(this.rows)
            });
            if (!resp.ok) {
                this.status = 'Failed to save CSV';
                return;
            }
            this.stage = 'done';
            this.status = 'CSV ready';
        }
    }
}).mount('#app');
</script>
</body>
</html>
