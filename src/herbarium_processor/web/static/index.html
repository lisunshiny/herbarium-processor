<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Herbarium Processor</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/cropperjs@1.5.13/dist/cropper.min.css">
    <script src="https://unpkg.com/cropperjs@1.5.13/dist/cropper.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .record img {
            display: block;
        }

        .image-panel {
            position: relative;
        }

        .panel-img {
            top: 0;
            left: 0;
            width: 100%;
        }

        .panel-width {
            width: 300px;
            min-width: 100px;
            max-width: 100vw;
            transition: width 0.1s;
        }

        .dynamic-textarea {
            width: fit-content;
            min-width: 4ch;
            max-width: 40ch;
        }
        .text-area {
            max-height: 90vh;
            overflow: scroll;
        }
        .crop-wrap {
            margin: 20px;
            max-width: 800px;
            max-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .crop-target {
            display: block;
            max-width: 100%;
            max-height: 100%;
            border: 20px solid transparent;
            box-sizing: content-box;
        }
        h1 {
            padding: 10px;
        }
    </style>
</head>

<body>
    <div id="app">
        <h1><a href="/">Herbarium Processor</a></h1>

        <div v-if="stage === 'upload'">
            <form @submit.prevent="upload" class="space-x-2">
                <input type="file" ref="files" multiple accept="image/*" class="border p-1 rounded">
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Upload</button>
            </form>
            <div v-if="jobs.length" class="mt-4">
                <h3 class="font-bold mb-2">Previous Jobs</h3>
                <ul class="list-disc list-inside">
                    <li v-for="jid in jobs" :key="jid">
                        <a :href="`/edit/${jid}`" class="text-blue-600 underline">{{ jid }}</a>
                    </li>
                </ul>
            </div>
        </div>

        <div v-if="stage === 'sanitize'">
            <h3>Adjust Image {{ cropIndex + 1 }} / {{ images.length }}</h3>
            <div class="crop-wrap">
                <img :src="images[cropIndex]" ref="cropImg" class="crop-target">
            </div>
            <div class="space-x-2 mt-2">
                <button @click="rotateLeft" class="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700">Rotate
                    Left</button>
                <button @click="rotateRight" class="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700">Rotate
                    Right</button>
                <button @click="nextCrop" class="px-3 py-1 bg-green-600 text-white rounded hover:bg-green-700">{{
                    cropIndex === images.length - 1 ? 'Finish' : 'Next' }}</button>
            </div>
        </div>
        <div v-if="stage === 'classifying'" class="mt-4 text-lg">
            {{ status }}
        </div>
        <div v-if="stage === 'edit'">
            <div v-for="(row, idx) in rows" :key="idx" class="record flex border p-4 mb-6 relative">
                <div :style="{ width: panelWidth + 'px' }"
                    class="relative flex-shrink-0 overflow-auto image-panel">
                    <img :src="row.ocr_image" alt="Annotated image" :style="{ width: panelWidth + 'px' }"
                        class="absolute top-0 left-0" />
                </div>
                <div class="w-1 bg-gray-300 cursor-col-resize" @mousedown="startDrag($event)"></div>
                <div class="text-area flex-1 pl-4">
                    <div class="font-bold mb-2">ID: {{ row.id }}</div>
                    <div v-for="field in fieldnames" class="mb-2">
                        <label class="block text-sm font-medium mb-1">{{ field }}</label>
                        <textarea v-model="row[field]"
                            :rows="Math.max(1, (row[field] || '').split('\n').length)"
                            :style="{ width: Math.min(40, (row[field] || '').length + 2) + 'ch' }"
                            class="border rounded p-1 resize-y w-fit"></textarea>
                    </div>
                </div>
            </div>
            <button @click="finalize" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Finalize
                CSV</button>
        </div>

        <div v-if="stage === 'done'">
            <a :href="`/download/${jobId}`" download
                class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Download CSV</a>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        const pathParts = window.location.pathname.split('/');
        const presetJobId = pathParts.length >= 3 && pathParts[1] === 'edit' ? pathParts[2] : '';

        createApp({
            data() {
                return {
                    stage: presetJobId ? 'edit' : 'upload',
                    jobId: presetJobId,
                    rows: [],
                    fieldnames: [],
                    status: '',
                    images: [],
                    cropIndex: 0,
                    cropData: [],
                    panelWidth: 700,
                    dragging: false,
                    startX: 0,
                    startWidth: 0,
                    cropper: null,
                    classifyInterval: null,
                    timeRemaining: 0,
                    rotation: 0,
                    jobs: []
                };
            },
            created() {
                if (this.jobId) {
                    this.fetchResults();
                } else {
                    this.fetchJobs();
                }
            },
            methods: {
                async fetchJobs() {
                    const resp = await fetch('/jobs');
                    if (resp.ok) {
                        const data = await resp.json();
                        this.jobs = data.jobs || [];
                    }
                },
                async upload() {
                    const files = this.$refs.files.files;
                    if (!files.length) {
                        alert('Please select at least one image.');
                        return;
                    }
                    this.status = 'Processing...';
                    const formData = new FormData();
                    for (const f of files) {
                        formData.append('files', f);
                    }
                    const resp = await fetch('/upload', { method: 'POST', body: formData });
                    if (!resp.ok) {
                        this.status = 'Upload failed';
                        return;
                    }
                    const data = await resp.json();
                    this.jobId = data.job_id;
                    this.images = data.images;
                    this.cropIndex = 0;
                    this.cropData = [];
                    this.jobs.unshift(this.jobId);
                    this.stage = 'sanitize';
                    this.$nextTick(this.initCropper);
                },
                async fetchResults() {
                    const resp = await fetch(`/results/${this.jobId}`);
                    if (!resp.ok) {
                        this.status = 'Failed to fetch results';
                        return;
                    }
                    const data = await resp.json();
                    this.fieldnames = data.fieldnames.filter(f => f !== 'id');
                    this.rows = data.rows;
                    this.panelWidth = 700;
                    this.stage = 'edit';
                    window.history.pushState(null, '', `/edit/${this.jobId}`);
                    this.status = '';
                },
                initCropper() {
                    if (this.cropper) this.cropper.destroy();
                    const img = this.$refs.cropImg;
                    this.rotation = 0;
                    this.cropper = new Cropper(img, {
                        viewMode: 1,
                        autoCropArea: 1,
                        zoomable: false,
                        movable: false,
                        scalable: false,
                        zoomOnWheel: false,
                        zoomOnTouch: false
                    });
                    this.centerImage();
                },
                rotateLeft() {
                    if (!this.cropper) return;
                    this.rotation = (this.rotation - 90 + 360) % 360;
                    this.applyRotation();
                },
                rotateRight() {
                    if (!this.cropper) return;
                    this.rotation = (this.rotation + 90) % 360;
                    this.applyRotation();
                },
                async nextCrop() {
                    const data = this.cropper.getData(true);
                    this.cropData.push({
                        filename: this.images[this.cropIndex].split('/').pop(),
                        x: data.x,
                        y: data.y,
                        width: data.width,
                        height: data.height,
                        rotate: data.rotate
                    });
                    if (this.cropIndex < this.images.length - 1) {
                        this.cropIndex++;
                        this.$nextTick(this.initCropper);
                    } else {
                        await this.submitCrops();
                    }
                },
                async submitCrops() {
                    this.stage = 'classifying';
                    this.timeRemaining = Math.ceil(this.cropData.length / 8) * 80;
                    this.status = `Classifying... ${this.formatTime(this.timeRemaining)} remaining`;
                    this.classifyInterval = setInterval(() => {
                        this.timeRemaining = Math.max(0, this.timeRemaining - 10);
                        this.status = `Classifying... ${this.formatTime(this.timeRemaining)} remaining`;
                    }, 10000);
                    const resp = await fetch(`/sanitize/${this.jobId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.cropData)
                    });
                    clearInterval(this.classifyInterval);
                    if (!resp.ok) {
                        this.status = 'Image processing failed';
                        return;
                    }
                    await this.fetchResults();
                },
                async finalize() {
                    const resp = await fetch(`/finalize/${this.jobId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.rows)
                    });
                    if (!resp.ok) {
                        this.status = 'Failed to save CSV';
                        return;
                    }
                    this.stage = 'done';
                    this.status = 'CSV ready';
                },
                startDrag(e) {
                    this.dragging = true;
                    this.startX = e.clientX;
                    this.startWidth = this.panelWidth;
                    this._onDrag = (ev) => this.onDrag(ev);
                    this._stopDrag = () => this.stopDrag();
                    window.addEventListener("mousemove", this._onDrag);
                    window.addEventListener("mouseup", this._stopDrag);
                },
                onDrag(e) {
                    if (!this.dragging) return;
                    const dx = e.clientX - this.startX;
                    this.panelWidth = Math.max(100, this.startWidth + dx);
                },
                stopDrag() {
                    window.removeEventListener("mousemove", this._onDrag);
                    window.removeEventListener("mouseup", this._stopDrag);
                    this.dragging = false;
                },
                applyRotation() {
                    this.cropper.reset();
                    this.cropper.rotateTo(this.rotation);
                    this.centerImage();
                },
                centerImage() {
                    const container = this.cropper.getContainerData();
                    const canvas = this.cropper.getCanvasData();
                    this.cropper.moveTo((container.width - canvas.width) / 2, (container.height - canvas.height) / 2);
                    this.cropper.setCropBoxData({
                        left: 0,
                        top: 0,
                        width: canvas.width,
                        height: canvas.height
                    });
                },
                formatTime(sec) {
                    const m = Math.floor(sec / 60);
                    const s = sec % 60;
                    return `${m}:${s.toString().padStart(2, '0')}`;
                }
            }
        }).mount('#app');
    </script>
</body>

</html>
