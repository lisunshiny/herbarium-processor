[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "herbarium-processor"
version = "0.1.0"
description = "Tools for processing herbarium specimen labels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipython",
    "google-generativeai",
    "python-dotenv",
    "pandas",
    "requests",
    "beautifulsoup4",
    "matplotlib",
    "seaborn",
    "pytesseract",
    "pillow-heif",
    "google-cloud-vision",
    "opencv-python",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
packages = []
