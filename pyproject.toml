[tool.poetry]
name = "herbarium-processor"
version = "0.1.0"
description = "Tools for processing herbarium specimen labels"
readme = "README.md"
authors = ["Liann Sun <lisunshiny@gmail.com>"]
license = "AGPL-3.0-or-later"

[tool.poetry.dependencies]
python = ">=3.10"
ipython = "*"
google-generativeai = "*"
python-dotenv = "*"
pandas = "*"
requests = "*"
beautifulsoup4 = "*"
matplotlib = "*"
seaborn = "*"
pytesseract = "*"
pillow-heif = "*"
google-cloud-vision = "*"
opencv-python = "*"
jinja2 = "*"
google_cloud_vision = "*"
fastapi = "*"
python-multipart = "*"
pyyaml = "*"
openai = "^1.102.0"
hypercorn = "^0.17.3"

[tool.poetry.group.dev.dependencies]
pytest = "*"
ipykernel = "^6.29.5"
nbstripout = "^0.8.1"
pre-commit = "^4.3.0"
httpx = "*"
pytest-asyncio = "^1.1.0"
ruff = "^0.14.0"

[tool.poetry.scripts]
dev = "scripts.dev:main"
demo = "scripts.demo:main"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Basic linting + import sorting
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["herbarium_processor"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
